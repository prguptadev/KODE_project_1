<!DOCTYPE html>
<html>
<head>
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
        }
        /* Sparkle animation */
        .sparkle {
            animation: sparkle-animation 1s forwards;
            transform-origin: center;
        }
        @keyframes sparkle-animation {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            25% { transform: scale(1.2) rotate(15deg); opacity: 0.7; }
            50% { transform: scale(1) rotate(0deg); opacity: 1; }
            75% { transform: scale(1.2) rotate(-15deg); opacity: 0.7; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <p id="message"></p>
    <button id="resetButton">Reset Game</button>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script>
        const board = document.getElementById('board');
        const message = document.getElementById('message');
        const resetButton = document.getElementById('resetButton');
        let currentPlayer = 1;
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function celebrate() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, particleCount: 70, gravity: 0.5, decay: 0.94, openOn: 0.75 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            (function frame() {
              const timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                confetti.reset();
                return;
              }

              const particleCount = 50 + Math.floor(randomInRange(50, 100));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 } }));

              requestAnimationFrame(frame);
            })();
        }

        function applySparkle(elements) {
            elements.forEach(el => {
                el.classList.add('sparkle');
                el.addEventListener('animationend', () => {
                    el.classList.remove('sparkle');
                }, { once: true });
            });
        }

        function checkWin() {
            for (let combination of winningCombinations) {
                const [a, b, c] = combination;
                if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
                    message.innerText = `Player ${currentPlayer} wins!`;
                    gameActive = false;
                    const winningCells = [document.querySelector(`[data-index="${a}"]`), document.querySelector(`[data-index="${b}"]`), document.querySelector(`[data-index="${c}"]`)];
                    applySparkle(winningCells);
                    celebrate();
                    return;
                }
            }

            if (!gameBoard.includes('')) {
                message.innerText = 'It\'s a draw!';
                gameActive = false;
                applySparkle(document.querySelectorAll('.cell'));
                celebrate();
            }
        }

        function cellClick(event) {
            const index = parseInt(event.target.dataset.index);

            if (gameBoard[index] === '' && gameActive) {
                gameBoard[index] = currentPlayer === 1 ? 'X' : 'O';
                event.target.innerText = currentPlayer === 1 ? 'X' : 'O';
                checkWin();
                if(gameActive){
                  currentPlayer = currentPlayer === 1 ? 2 : 1;
                  message.innerText = `Player ${currentPlayer}'s turn`;
                }
            }
        }

        function resetGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 1;
            message.innerText = 'Player 1\'s turn';
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.innerText = '';
                cell.classList.remove('sparkle');
            });
        }

        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            cell.addEventListener('click', cellClick);
        });

        resetButton.addEventListener('click', resetGame);

        resetGame();
    </script>
</body>
</html>
